<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" viewBox="0 -2 160.29 73.5" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="APH Games" overflow="visible">
	<defs>
		<!-- Chip plastic body -->
		<linearGradient id="aphChipBody" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#3c4554"/>
			<stop offset="28%" stop-color="#2a323e"/>
			<stop offset="62%" stop-color="#1d232d"/>
			<stop offset="100%" stop-color="#12161d"/>
		</linearGradient>
		<linearGradient id="aphChipSheen" x1="0" y1="0" x2="1" y2="0.85">
			<stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
			<stop offset="35%" stop-color="#9eb6ff" stop-opacity="0.05"/>
			<stop offset="70%" stop-color="#ffffff" stop-opacity="0.015"/>
			<stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
		</linearGradient>
		<radialGradient id="aphChipVignette" cx="50%" cy="45%" r="72%">
			<stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
			<stop offset="100%" stop-color="#000000" stop-opacity="0.28"/>
		</radialGradient>

		<!-- Controls -->
		<linearGradient id="aphDpadGrad" x1="0" y1="0" x2="0.2" y2="1">
			<stop offset="0%" stop-color="#d0d6de"/>
			<stop offset="40%" stop-color="#939da9"/>
			<stop offset="100%" stop-color="#5a6472"/>
		</linearGradient>
		<radialGradient id="aphBtnGrad" cx="32%" cy="28%" r="72%">
			<stop offset="0%" stop-color="#dce1e8"/>
			<stop offset="45%" stop-color="#94a0ae"/>
			<stop offset="100%" stop-color="#525c6a"/>
		</radialGradient>
		<filter id="aphControlShade" x="-25%" y="-25%" width="150%" height="150%">
			<feDropShadow dx="0" dy="0.55" stdDeviation="0.4" flood-color="#03030c" flood-opacity="0.5"/>
		</filter>

		<!-- Pins: metal + careful glow -->
		<linearGradient id="aphPinGrad" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#eef2f7"/>
			<stop offset="30%" stop-color="#c0c8d4"/>
			<stop offset="100%" stop-color="#7d8796"/>
		</linearGradient>
		<linearGradient id="aphPinGradBottom" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0%" stop-color="#eef2f7"/>
			<stop offset="30%" stop-color="#c0c8d4"/>
			<stop offset="100%" stop-color="#7d8796"/>
		</linearGradient>
		<filter id="aphPinAura" x="-100%" y="-280%" width="300%" height="660%" color-interpolation-filters="sRGB">
			<feGaussianBlur in="SourceGraphic" stdDeviation="0.7" result="blur"/>
			<feColorMatrix in="blur" type="matrix"
				values="0.3 0 0 0 0.2
				        0.5 0 0 0 0.35
				        1.15 0 0 0 0.65
				        0 0 0 0.65 0"
				result="glow"/>
			<feMerge>
				<feMergeNode in="glow"/>
				<feMergeNode in="SourceGraphic"/>
			</feMerge>
		</filter>
		<filter id="aphPinSoftBloom" x="-140%" y="-360%" width="380%" height="820%" color-interpolation-filters="sRGB">
			<feGaussianBlur stdDeviation="1.55"/>
			<feColorMatrix type="matrix"
				values="0.22 0 0 0 0.14
				        0.4 0 0 0 0.3
				        1.05 0 0 0 0.62
				        0 0 0 0.5 0"/>
		</filter>
	</defs>

	<!-- Soft azure bloom behind pin rows -->
	<g opacity="0.62" filter="url(#aphPinSoftBloom)" aria-hidden="true">
		<path fill="#7893EA" d="m1.3359 0h10.686v1.8h-10.686z"/>
		<path fill="#7893EA" d="m14.694 0h10.686v1.8h-10.686z"/>
