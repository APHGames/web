		<path fill="#7893EA" d="m81.483 67.7h10.686v1.8h-10.686z"/>
		<path fill="#7893EA" d="m94.841 67.7h10.686v1.8h-10.686z"/>
		<path fill="#7893EA" d="m108.2 67.7h10.686v1.8h-10.686z"/>
		<path fill="#7893EA" d="m121.56 67.7h10.686v1.8h-10.686z"/>
		<path fill="#7893EA" d="m134.91 67.7h10.686v1.8h-10.686z"/>
		<path fill="#7893EA" d="m148.27 67.7h10.686v1.8h-10.686z"/>
	</g>

	<!-- Chip body -->
	<g>
		<rect y="1.3358" width="160.29" height="66.789" fill="url(#aphChipBody)"/>
		<rect y="1.3358" width="160.29" height="66.789" fill="url(#aphChipSheen)"/>
		<rect y="1.3358" width="160.29" height="66.789" fill="url(#aphChipVignette)"/>
		<rect y="1.3358" width="160.29" height="1.35" fill="#ffffff" opacity="0.09"/>
		<rect y="65.9" width="160.29" height="2.22" fill="#000000" opacity="0.28"/>
	</g>

	<!-- Gamepad controls -->
	<g filter="url(#aphControlShade)">
		<path fill="url(#aphDpadGrad)" d="m33.395 14.694v13.358h-13.358v13.358h13.358v13.358h13.358v-13.358h13.358v-13.358h-13.358v-13.358z"/>
		<!-- tiny d-pad specular -->
		<path fill="#ffffff" opacity="0.12" d="m33.395 14.694h13.358v2.2h-13.358z"/>
		<circle fill="url(#aphBtnGrad)" cx="133.58" cy="34.73" r="6.6789"/>
		<circle fill="url(#aphBtnGrad)" cx="120.22" cy="21.373" r="6.6789"/>
		<circle fill="url(#aphBtnGrad)" cx="120.22" cy="48.088" r="6.6789"/>
		<circle cx="131.75" cy="32.75" r="1.7" fill="#ffffff" opacity="0.22"/>
		<circle cx="118.4" cy="19.4" r="1.55" fill="#ffffff" opacity="0.2"/>
		<circle cx="118.4" cy="46.1" r="1.55" fill="#ffffff" opacity="0.18"/>
	</g>

	<!-- Pins -->
	<g filter="url(#aphPinAura)">
		<g fill="url(#aphPinGrad)">
			<path d="m1.3359 0h10.686v1.3358h-10.686z"/>
			<path d="m14.694 0h10.686v1.3358h-10.686z"/>
			<path d="m28.052 0h10.686v1.3358h-10.686z"/>
			<path d="m41.409 0h10.686v1.3358h-10.686z"/>
			<path d="m54.767 0h10.686v1.3358h-10.686z"/>
