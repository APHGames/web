			<path d="m121.56 0h10.686v1.3358h-10.686z"/>
			<path d="m134.91 0h10.686v1.3358h-10.686z"/>
			<path d="m148.27 0h10.686v1.3358h-10.686z"/>
		</g>
		<g fill="url(#aphPinGradBottom)">
			<path d="m1.3359 68.125h10.686v1.3358h-10.686z"/>
			<path d="m14.694 68.125h10.686v1.3358h-10.686z"/>
			<path d="m28.052 68.125h10.686v1.3358h-10.686z"/>
			<path d="m41.409 68.125h10.686v1.3358h-10.686z"/>
			<path d="m54.767 68.125h10.686v1.3358h-10.686z"/>
			<path d="m68.125 68.125h10.686v1.3358h-10.686z"/>
			<path d="m81.483 68.125h10.686v1.3358h-10.686z"/>
			<path d="m94.841 68.125h10.686v1.3358h-10.686z"/>
